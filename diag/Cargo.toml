[package]
name = "diag"
version = "0.1.0"
edition = "2021"

# Deliberately detached from the parent workspace (empty `[workspace]` table
# below), same shape as `hal/Cargo.toml`/`ext2/Cargo.toml`/`mm/Cargo.toml`/
# `vfs/Cargo.toml` — see those files' comments for the full reasoning (short
# version: the parent root Cargo.toml's `panic = "abort"` profile would break
# this crate's own unwinding `cargo test` harness). Not listed in the root
# Cargo.toml's `members` for the same reason; the root `Cargo.toml`'s
# `exclude` comment has the full list.
[workspace]

[dependencies]
# The four diagnostic counters need nothing but `core::sync::atomic` +
# `alloc::format`/`String`, same as the pre-extraction code in
# `kernel/src/debug.rs`. `spin` is here only for `tracked::TrackedMutex`,
# which wraps a real `spin::Mutex` so the acquire/release *ordering* around
# it can be enforced in one place instead of re-derived at every call site.
# Same version the rest of this repo already resolves to (`hal`, `vfs`), so
# there is only ever one `spin` in the dependency graph.
spin = "0.10.0"
