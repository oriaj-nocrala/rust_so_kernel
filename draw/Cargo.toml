[package]
name = "draw"
version = "0.1.0"
edition = "2021"

# Software 2D drawing into a plain `&mut [u32]` of 0x00RRGGBB pixels:
# colour arithmetic, clipped primitives, antialiased discs, additive glow,
# blits and two pixel fonts. no_std, no alloc, no syscalls, integer only
# (written when the userspace target was soft-float; it has SSE2 now) —
# `cd draw && cargo test`. Its own
# workspace root (empty table below), like `gui`/`vt`: the parent
# workspace's `panic = "abort"` would break the test harness. `userspace`
# depends on it by path; `userspace::gfx` is what puts the pixels on screen.
[workspace]

[dependencies]
# Antialiased text (`smooth`), behind the `noto` feature so the crate stays
# dependency-free by default. Same crate, version and sizes as `vt` and the
# kernel console, so all three draw identical glyphs.
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_24", "size_32", "unicode-basic-latin"], optional = true }

[features]
noto = ["dep:noto-sans-mono-bitmap"]
