[package]
name = "mm"
version = "0.1.0"
edition = "2021"

# Deliberately detached from the parent workspace (empty `[workspace]` table
# below), same shape as `hal/Cargo.toml`/`ext2/Cargo.toml` — see those files'
# comments for the full reasoning (short version: the parent root
# Cargo.toml's `panic = "abort"` profile would break this crate's own
# unwinding `cargo test` harness). Not listed in the root Cargo.toml's
# `members` for the same reason; the root `Cargo.toml`'s `exclude` comment
# has the full list.
[workspace]

[dependencies]
# Pinned to the EXACT version the kernel's own Cargo.lock already resolves
# to, not just a compatible range: `0.15.5` fails to build against this
# repo's pinned nightly (`nightly-2026-03-08`) — `Step` trait shape mismatch
# in `x86_64`'s `paging::Page`/`PageTable` impls, verified directly by
# trying it, not assumed. `x86_64::PhysAddr`/`VirtAddr` (all this crate
# actually uses) have no bare-metal-only code path, so the crate builds and
# runs identically on the host.
x86_64 = "=0.15.4"

[features]
default = []
# Debug-only slab instrumentation (redzone + quarantine, 2026-08-05 bug-2
# hunt). OFF by default: with it off, the slot layout is the pre-instrumentation
# reference (slot = object_size) so the kernel's heap addresses and flake/PANIC
# rates return to the baseline that the rest of the investigation measured.
# Flip it on (debug builds) to re-enable the redzone/quarantine; the host tests
# exercise both under `cargo test --features slab-debug` (and are `#[cfg]`'d
# out otherwise — `cargo test` stays green without the feature).
slab-debug = []

[dev-dependencies]
# Integration tests under `tests/` compile as separate crates that only see
# `mm`'s public API plus `[dev-dependencies]` — a plain `[dependencies]`
# entry (above) isn't automatically visible there. The property tests in
# `tests/buddy_invariants.rs`/`tests/slab_frame_source.rs` need to *name*
# `x86_64::PhysAddr` themselves (constructing addresses to pass back into
# `deallocate`/`is_free`/etc.), so it's pinned here too — same exact version
# as above, so there's only ever one `x86_64` in the dependency graph.
x86_64 = "=0.15.4"
