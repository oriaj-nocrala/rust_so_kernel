[binaries]
c = ['clang', '--target=x86_64-linux-musl', '-nostdlibinc', '-isystem', '/usr/lib/musl/include', '-isystem', '/home/oriaj/src/gpu-ref/musl-inc']
cpp = ['clang++', '--target=x86_64-linux-musl', '-nostdlibinc', '-isystem', '/usr/include/c++/16', '-isystem', '/usr/include/c++/16/x86_64-pc-linux-gnu', '-isystem', '/usr/lib/musl/include', '-isystem', '/home/oriaj/src/gpu-ref/musl-inc', '-D__GLIBC_PREREQ(a,b)=0', '-include', '/home/oriaj/src/gpu-ref/musl-inc/musl_compat.h']
rust = ['rustc', '--target', 'x86_64-unknown-linux-musl']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'
llvm-config = '/usr/bin/llvm-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_link_args = ['-static', '-fuse-ld=lld']
cpp_link_args = ['-static', '-fuse-ld=lld']
