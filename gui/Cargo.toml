[package]
name = "gui"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"

# Host-testable core of the userspace compositor (phase 2.4 of
# docs/gui/gui-plan.md): the wire format, rectangle regions and the
# compositor's state machine. no_std + alloc, no syscalls — `cd gui && cargo
# test`. Its own workspace root (empty table below), like `usock`/`hal`:
# the parent workspace's `panic = "abort"` would break the test harness.
# `userspace` depends on it by path.
[workspace]

[dependencies]

[dev-dependencies]
# Only to check that `semantic` mirrors AccessKit's names (roles, actions); the crate itself does not depend on it.
accesskit = { version = "=0.24.1", default-features = false }
