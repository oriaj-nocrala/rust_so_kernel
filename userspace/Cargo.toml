[workspace]

[package]
name = "userspace"
version = "0.1.0"
edition = "2021"

[lib]
name = "userspace"
path = "src/lib.rs"

[dependencies]
# The compositor's host-tested core (phase 2.4 of docs/gui/gui-plan.md).
gui = { path = "../gui" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
codegen-units = 1
