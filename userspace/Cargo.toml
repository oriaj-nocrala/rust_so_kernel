[workspace]

[package]
name = "userspace"
version = "0.1.0"
edition = "2021"

[lib]
name = "userspace"
path = "src/lib.rs"

[dependencies]
# The compositor's host-tested core (phase 2.4 of docs/gui/gui-plan.md).
gui = { path = "../gui" }
# The terminal emulator behind `term` (phase 3.4/3.5 of docs/gui/gui-plan.md).
vt = { path = "../vt" }
# Software 2D drawing (canvas, primitives, pixel fonts) for graphical
# programs; `userspace::gfx` puts the result on screen.
draw = { path = "../draw", features = ["noto"] }
# `sched::cputime`: the `/proc/stat` line format, shared with the kernel
# that renders it (`cpumon` parses it).
sched = { path = "../sched" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
codegen-units = 1
